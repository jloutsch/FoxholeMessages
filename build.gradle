// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.androidx_appcompat_version = '1.6.1'
    ext.androidx_emoji2_version = '1.4.0'
    ext.androidx_constraintlayout_version = '1.1.3'
    ext.androidx_core_version = '1.17.0'
    ext.androidx_documentfile_version = '1.0.1'
    ext.androidx_exifinterface_version = '1.0.0'
    ext.androidx_testrunner_version = '1.1.0-alpha3'
    ext.androidx_viewpager_version = '1.0.0-beta05'
    ext.autodispose_version = '1.3.0'
    ext.billing_version = '5.1.0'
    ext.conductor_version = '2.1.5'
    ext.coroutines_version = '1.4.3'
    ext.dagger_version = "2.18"
    ext.espresso_version = '3.1.0-alpha3'
    ext.media3_version = "1.1.1"
    ext.glide_version = "4.16.0"
    ext.junit_version = '4.12'
    ext.kotlin_version = '2.2.21'
    ext.lifecycle_version = '2.1.0'
    ext.material_version = '1.6.1'
    ext.mockito_version = '2.18.3'
    ext.moshi_version = '1.8.0'
    ext.okhttp3_version = '4.12.0'
    ext.realm_version = '10.19.0'
    ext.realm_adapters_version = '3.1.0'
    ext.rxandroid_version = '2.0.1'
    ext.rxdogtag_version = '0.2.0'
    ext.rxbinding_version = '2.0.0'
    ext.rxjava_version = '2.1.4'
    ext.rxkotlin_version = '2.1.0'
    ext.rx_preferences_version = '2.0.0-RC3'
    ext.timber_version = '5.0.1'
    ext.androidx_work_version = "2.8.0"

    ext.abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2]

    // Build plugins (Android Gradle Plugin, Kotlin, Realm) all come from Google Maven or Maven
    // Central, so JitPack isn't listed here.
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "io.realm:realm-gradle-plugin:$realm_version"
    }
}

// The one list of repositories for every module (the modules don't declare their own).
// jcenter() is gone: it has been read-only since 2021 and is being shut down. The old Sonatype
// snapshots repository (oss.sonatype.org) was shut down in June 2025.
allprojects {
    repositories {
        google()
        mavenCentral()
        // JitPack builds artifacts from GitHub source on demand. Only a few libraries here are
        // published nowhere else, so it is last and limited to com.github.* groups: it is never
        // asked for anything else, so it can't substitute a different build of a library that
        // Google or Maven Central already serve.
        maven {
            url "https://jitpack.io"
            content { includeGroupByRegex "com\\.github\\..*" }
        }
    }

    // Kotlin 1.8+ compiles for the JDK running Gradle (17) unless told otherwise, and the build
    // refuses Kotlin and Java targets that differ. Java is 1.8 in every module, so Kotlin is too.
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
        // An annotation on a constructor `val` (Moshi's @Json, Dagger's @Named) goes on the
        // parameter and the property, which becomes Kotlin's default in a later release. Moshi's
        // reflective adapter and Dagger read the parameter either way.
        compilerOptions.freeCompilerArgs.add("-Xannotation-default-target=param-property")
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

subprojects {
    afterEvaluate {
        if (project.hasProperty('kapt')) {
            kapt {
                // we expect this closure to run over a org.jetbrains.kotlin.gradle.plugin.KaptExtension
                javacOptions {
                    option("-source", "8")
                    option("-target", "8")
                }
            }
        }
    }
}
