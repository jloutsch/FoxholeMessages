apply plugin: 'com.android.application'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk 36

    defaultConfig {
        applicationId 'com.foxhole.messages'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 2281
        versionName '2.9.12'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug // Uses the default debug keystore.
        release {
            def keystoreProps = new Properties()
            def keystorePropsFile = rootProject.file('./.gradle/.gradlerc')
            storeFile file('./my-release-key.keystore')
            keyAlias 'foxhole_messages_release'
            if (keystorePropsFile.exists()) {
                keystoreProps.load(new FileInputStream(keystorePropsFile))
            } else {
                // do nothing
            }
            storePassword keystoreProps['storePassword']
            keyPassword keystoreProps['keyPassword']
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
    
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue("string", "app_name", "Foxhole Messages-Debug")
            resValue("string", "application_id", defaultConfig.applicationId)
            signingConfig signingConfigs.debug
        }
        fdroid {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            matchingFallbacks = ['release']
            applicationIdSuffix ".fdroid"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        // Findings that existed when lint started failing the build; only new ones fail it now.
        // Regenerate with ./gradlew :presentation:updateLintBaseline after fixing some.
        baseline = file("lint-baseline.xml")
        // Translations lag the English strings on purpose, so a new string isn't an error.
        disable 'MissingTranslation'
    }
    namespace 'dev.octoshrimpy.quik'
    // MaterialThemeTest reads the real themes
    testOptions.unitTests.includeAndroidResources = true

    buildFeatures {
        buildConfig true
        viewBinding true
        resValues true // the debug build's app name; AGP 9 turns this off by default
    }
    if (System.getenv("CI") == "true") {
        signingConfigs.release.storePassword = System.getenv("keystore_password")
        signingConfigs.release.keyAlias = System.getenv("key_alias")
        signingConfigs.release.keyPassword = System.getenv("key_password")
    }
}

// APKs are named FoxholeMessages-v<version>-<build type>.apk (the release workflows expect it).
// AGP 9 no longer takes archivesBaseName in defaultConfig.
base {
    archivesName = "FoxholeMessages-v${android.defaultConfig.versionName}"
}

configurations {
    debug
    release
    fdroid
}

dependencies {
    // lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    // androidx
    implementation "androidx.appcompat:appcompat:$androidx_appcompat_version"
    implementation "androidx.emoji2:emoji2-bundled:$androidx_emoji2_version"
    implementation "androidx.constraintlayout:constraintlayout:$androidx_constraintlayout_version"
    // BackupPresenter reads the backup folder as a DocumentFile (it used to arrive through RxJava-era libraries)
    implementation "androidx.documentfile:documentfile:$androidx_documentfile_version"
    implementation "androidx.core:core-ktx:$androidx_core_version"
    implementation "androidx.room:room-runtime:$room_version" // AppModule builds the database
    // androidx.core 1.12+ brings Lifecycle 2.6, which activity 1.6 (from appcompat) wasn't built
    // against: Kotlin then says the dialogs don't implement LifecycleOwner.lifecycle. 1.7+ matches.
    implementation "androidx.activity:activity:1.7.2"
    implementation "androidx.viewpager2:viewpager2:$androidx_viewpager_version"
    implementation "com.google.android.material:material:$material_version"
    implementation("androidx.work:work-runtime-ktx:$androidx_work_version")

    // conductor
    implementation "com.bluelinelabs:conductor:$conductor_version"
    implementation "com.bluelinelabs:conductor-archlifecycle:$conductor_version"

    // glide
    implementation "com.github.bumptech.glide:glide:$glide_version"
    ksp "com.github.bumptech.glide:ksp:$glide_version"

    // media3 - ExoPlayer's current name (it replaced the 2018 JitPack r2.9.0 that rendered modern
    // phone video badly). It parses videos people send, so keep it current.
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"



    // dagger
    implementation "com.google.dagger:dagger:$dagger_version"
    implementation "com.google.dagger:dagger-android-support:$dagger_version"
    ksp "com.google.dagger:dagger-compiler:$dagger_version"
    ksp "com.google.dagger:dagger-android-processor:$dagger_version"
    //Resolve jdk8+ Generation Annotations - javax annotation does not exist
    implementation 'com.github.pengrad:jdk9-deps:1ffe84c468'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // ezvcard
    implementation('com.googlecode.ez-vcard:ez-vcard:0.12.2', {
        exclude group: "org.jsoup", module: "jsoup"
        exclude group: "org.freemarker", module: "freemarker"
        exclude group: "com.fasterxml.jackson.core", module: "jackson-core"
        exclude group: "com.fasterxml.jackson.core", module: "jackson-databind"
    })




    // testing
    testImplementation "junit:junit:$junit_version"
    // Android's org.json is only a stub in plain JVM unit tests; use the real library there.
    testImplementation "org.json:json:20240303"
    // Real Android views and phone-number formatting in plain unit tests (BlockedNumberTextWatcherTest)
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation "androidx.test:core:1.6.1"

    // moshi
    implementation "com.squareup.moshi:moshi:$moshi_version"

    // coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    implementation "com.github.chrisbanes:photoview:2.1.4"
    implementation "com.github.google:flexbox-layout:0.3.1"
    implementation "com.jakewharton.timber:timber:$timber_version"

    // link previews (thumbnail/title/description unfurling for URLs in messages)
    // Previews are off (no INTERNET permission; see CLAUDE.md), so this only has to compile.
    implementation "me.saket.unfurl:unfurl:1.7.0"
    implementation "me.leolin:ShortcutBadger:1.1.22"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation project(":android-smsmms")
    implementation project(":common")
    implementation project(':data')
    implementation project(':domain')

}
// Check to make sure that the keystore file is present when building a release
gradle.taskGraph.whenReady { taskGraph ->
    if ((taskGraph.hasTask(':assembleRelease') ||
            taskGraph.allTasks.any { it.name == 'assembleRelease' }) &&
            !file('./.gradle/.gradlerc').exists() &&
            System.getenv("CI") != "true") {
        throw new GradleException("Keystore properties file not found")
    }
}

// ProguardRulesTest and ReleaseConsistencyTest read these files; declare them so editing one re-runs
// the tests instead of Gradle reusing an earlier pass.
tasks.withType(Test).configureEach {
    inputs.file("proguard-rules.pro")
    // MainThreadDatabaseUpdatesTest reads these
    inputs.dir("src/main/java")
    inputs.files("../data/src/main/java/com/moez/QKSMS/repository/ConversationRepositoryImpl.kt", "../data/src/main/java/com/moez/QKSMS/repository/ContactRepositoryImpl.kt")
    inputs.file("build.gradle")
    inputs.file("../data/src/main/assets/changelog.json")
    inputs.dir("../metadata/en-US/changelogs")
    inputs.file("../fdroid/metadata/com.foxhole.messages.yml")
    inputs.files("src/main/res/xml/shortcuts.xml", "src/debug/res/xml/shortcuts.xml", "src/fdroid/res/xml/shortcuts.xml")
}
