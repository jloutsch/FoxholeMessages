name: Auto-Update MMS configs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 1,4,7,10 *'

concurrency:
  group: auto-update-mms-configs
  cancel-in-progress: false

# Only what the pull-request step needs.
permissions:
  contents: write
  pull-requests: write

jobs:
  vvm:
    runs-on: ubuntu-latest
    env:
      APKEEP_VERSION: 0.18.0
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 
      
      - name: Cache Cargo dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-apkeep-${{ env.APKEEP_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cargo-apkeep-
      
      - name: Set Branch Name
        run: echo "NEW_BRANCH=update-mms-configs-$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
      
      - name: Install apkeep
        shell: bash
        run: |
          set -euo pipefail
          if command -v apkeep >/dev/null 2>&1; then
            installed_version=$(apkeep --version | awk '{print $2}')
            if [[ "$installed_version" == "$APKEEP_VERSION" ]]; then
              echo "apkeep ${APKEEP_VERSION} already installed."
              exit 0
            fi
          fi
          cargo install apkeep --locked --version "$APKEEP_VERSION"
        
      - name: Install APK tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apktool unzip
          
      # The APK path used to be hardcoded as /home/runner/work/foxholemessages/..., which doesn't
      # match this repo's mixed-case name, so the decompile step never found the APK. Download into
      # the runner's temp dir instead, outside the checkout.
      - name: Download Messaging APK
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          apkeep -a com.google.android.apps.messaging "$RUNNER_TEMP/apk"
          ls -l "$RUNNER_TEMP/apk"

      - name: Unzip the Messaging APK from XAPK
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/apk/com.google.android.apps.messaging.xapk" ]; then
            unzip "$RUNNER_TEMP/apk/com.google.android.apps.messaging.xapk" -d "$RUNNER_TEMP/apk"
          else
            echo "XAPK file not found, skipping unzip."
          fi

      # apkeep downloads from a third-party mirror by default, so record who signed the APK. The
      # signer's certificate digest goes into the pull request for the reviewer to compare with
      # Google's; a tampered APK could otherwise change carrier MMS server settings unnoticed.
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$RUNNER_TEMP/apk/com.google.android.apps.messaging.apk" \
            | grep -E "Signer #1 certificate (DN|SHA-256 digest)" | tee "$RUNNER_TEMP/signer.txt"
          {
            echo "APK_SIGNER<<EOF"
            cat "$RUNNER_TEMP/signer.txt"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Decompile Messaging using apktool
        run: apktool d "$RUNNER_TEMP/apk/com.google.android.apps.messaging.apk" -o "$RUNNER_TEMP/dump"
        
      - name: Copy MMS configs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rfv android-smsmms/src/main/res/xml-mcc*
          source_dirs=("$RUNNER_TEMP"/dump/res/xml-mcc*)
          if [[ "${#source_dirs[@]}" -eq 0 ]]; then
            echo "No MMS config directories found in dump." >&2
            exit 1
          fi
          cp -rv "${source_dirs[@]}" android-smsmms/src/main/res/
          find android-smsmms/src/main/res/xml-mcc* -name '*_config_override.xml' -print -delete

      - name: Remove Duplicate MMS Config Files
        shell: bash
        run: |
          set -euo pipefail
          declare -A seen
          for file in android-smsmms/src/main/res/xml-mcc*/mms_config.xml; do
            dir_name=$(dirname "$file")
            if [[ "$dir_name" == *-mnc00 ]]; then
              # Check for corresponding directory without -mnc suffix
              base_dir=$(echo "$dir_name" | sed 's/-mnc00//')
              if [[ -d "$base_dir" ]]; then
                echo "Duplicate found for $base_dir and $dir_name"
                rm -rf "$base_dir"
              fi
            fi
          done
          
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update MMS configs from com.google.android.apps.messaging.apk. 
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "Update MMS configs"
          body: |
            This pull request updates the MMS configurations to the latest version.
              - Updated by [Auto-Update MMS configs](./.github%2Fworkflows%2Fauto-update-mms-configs.yml)

            The APK was downloaded from a third-party mirror. Before merging, check that its signer
            is Google:
            ```
            ${{ env.APK_SIGNER }}
            ```
          add-paths: android-smsmms/src/main/res/xml-mcc*
          branch: ${{ env.NEW_BRANCH }}
          base: master
          labels: automated
