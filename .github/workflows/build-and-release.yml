name: Build and Release

on:
  workflow_dispatch:
    inputs: &release-inputs
      release_ref:
        description: Branch or tag to build from
        required: false
        default: master
        type: string
      publish_release:
        description: Publish the GitHub Release immediately (disable to keep it as a draft)
        type: boolean
        default: true
      prerelease:
        description: Mark the GitHub Release as a pre-release
        type: boolean
        default: false
  workflow_call:
    inputs: *release-inputs

concurrency:
  group: build-and-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Read-only: this job only checks out code and uploads build artifacts. Publishing the
    # release (which needs write) happens in the separate publish job, which never sees the key.
    permissions:
      contents: read

    env:
      RELEASE_REF: ${{ inputs.release_ref || 'master' }}

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      apk_fdroid_path: ${{ steps.fdroid_artifact.outputs.apk_fdroid_path }}
      aab_release_path: ${{ steps.bundle_artifact.outputs.aab_release_path }}
      checksums_path: ${{ steps.checksums.outputs.checksums_path }}

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Ensure release ref is merged into master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error title=Release blocked::${RELEASE_REF} is not merged into master. Merge the release PR first."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Only checks that the secrets exist. The signing key and its passwords are handed to the one
      # step that needs them (the Gradle build below) and nowhere else: they used to be written to
      # $GITHUB_ENV, which exposes them to every later step in the job, third-party actions included.
      - name: Validate signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error title=Missing secret::${var} is not set."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Capture version metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, pathlib, re
          gradle = pathlib.Path("presentation/build.gradle").read_text()
          code_match = re.search(r"^\s*versionCode\s+(\d+)", gradle, re.MULTILINE)
          name_match = re.search(r"^\s*versionName\s+['\"]([\d\.]+)['\"]", gradle, re.MULTILINE)
          if not code_match or not name_match:
              raise SystemExit("Unable to read versionCode/versionName from presentation/build.gradle")
          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"version_code={code_match.group(1)}\n"
              f"version_name={name_match.group(1)}\n"
              f"tag_name=v{name_match.group(1)}\n"
          )
          PY

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      # The keystore is written to disk here, after every third-party action in this job has
      # already run, and removed by the next step whether or not the build succeeds.
      - name: Build signed release APK and app bundle
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # Names presentation/build.gradle reads when CI=true.
          keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p presentation
          echo "$KEYSTORE_B64" | base64 -d > presentation/my-release-key.keystore
          chmod 600 presentation/my-release-key.keystore
          ./gradlew clean assembleRelease assembleFdroid bundleRelease

      - name: Remove signing key
        if: always()
        run: rm -f presentation/my-release-key.keystore

      - name: Report obfuscation coverage
        shell: bash
        run: |
          set -euo pipefail
          mapping=presentation/build/outputs/mapping/release/mapping.txt
          if [[ ! -f "$mapping" ]]; then
            echo "::warning title=No mapping file::${mapping} not found - release build was not minified."
            exit 0
          fi
          python3 .github/scripts/obfuscation_report.py "$mapping" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Locate release artifact
        id: release_artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(presentation/build/outputs/apk/release/FoxholeMessages-v*-release.apk)
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "::error title=APK lookup failed::Expected 1 APK, found ${#files[@]} (${files[*]:-none})."
            exit 1
          fi
          echo "apk_release_path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Locate f-droid artifact
        id: fdroid_artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(presentation/build/outputs/apk/fdroid/FoxholeMessages-v*-fdroid.apk)
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "::error title=APK lookup failed::Expected 1 APK, found ${#files[@]} (${files[*]:-none})."
            exit 1
          fi
          echo "apk_fdroid_path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Locate app bundle (for Play Store upload)
        id: bundle_artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(presentation/build/outputs/bundle/release/FoxholeMessages-v*-release.aab)
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "::error title=AAB lookup failed::Expected 1 AAB, found ${#files[@]} (${files[*]:-none})."
            exit 1
          fi
          echo "aab_release_path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate checksum
        id: checksums
        shell: bash
        run: |
          find . \( -name '*.apk' -o -name '*.aab' \) -type f -exec sha256sum {} \; > checksums.txt
          echo "checksums_path=checksums.txt" >> "$GITHUB_OUTPUT"

      - name: Upload all build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: |
            ${{ steps.release_artifact.outputs.apk_release_path }}
            ${{ steps.fdroid_artifact.outputs.apk_fdroid_path }}
            ${{ steps.bundle_artifact.outputs.aab_release_path }}
            ${{ steps.checksums.outputs.checksums_path }}

  generate_release_notes:
    needs: build
    uses: ./.github/workflows/generate-release-notes.yml
    permissions:
      contents: write
    with:
      release_ref: ${{ inputs.release_ref || 'master' }}
      version_name: ${{ needs.build.outputs.version_name }}

  publish:
    needs: [build, generate_release_notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Sanitize release notes
        id: clean_notes
        env:
          NOTES: ${{ needs.generate_release_notes.outputs.release_notes }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re, pathlib
          notes = os.environ.get("NOTES", "")
          clean = re.sub(r'(?<!\w)@([A-Za-z0-9][A-Za-z0-9-]*)', r'\1', notes)
          pathlib.Path("sanitized_notes.txt").write_text(clean)
          PY
          {
            echo "clean_notes<<EOF"
            cat sanitized_notes.txt
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: downloaded/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: Foxhole Messages v${{ needs.build.outputs.version_name }}
          draft: ${{ inputs.publish_release != true }}
          prerelease: ${{ inputs.prerelease }}
          body: ${{ steps.clean_notes.outputs.clean_notes }}
          files: |
            downloaded/**/*.apk
            downloaded/*.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
