name: Build and Test on Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Cache debug keystore
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.android/debug.keystore
        key: android-debug-keystore-v1

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Run Android Lint
      run: ./gradlew lint

    - name: Run Tests
      run: ./gradlew test

    - name: List APK Output Directory 
      run: ls -R presentation/build/outputs/apk/debug

    - name: Rename APK
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        mapfile -t apk_files < <(printf '%s\n' presentation/build/outputs/apk/debug/FoxholeMessages-v*-debug.apk)
        if [[ "${#apk_files[@]}" -eq 0 ]]; then
          echo "No APK found matching FoxholeMessages-v*-debug.apk" >&2
          exit 1
        fi
        if [[ "${#apk_files[@]}" -gt 1 ]]; then
          echo "Multiple APKs found: ${apk_files[*]}" >&2
          exit 1
        fi
        mv "${apk_files[0]}" presentation/build/outputs/apk/debug/FoxholeMessages-debug.apk

    - name: Upload App
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: apk-debug
        path: presentation/build/outputs/apk/debug/FoxholeMessages-debug.apk
