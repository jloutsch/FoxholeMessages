apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk 24
        targetSdkVersion 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    namespace 'dev.octoshrimpy.quik.data'
}

dependencies {

    // androidx
    implementation "androidx.appcompat:appcompat:$androidx_appcompat_version"
    implementation "androidx.core:core-ktx:$androidx_core_version"
    implementation "androidx.exifinterface:exifinterface:$androidx_exifinterface_version"
    implementation "androidx.documentfile:documentfile:$androidx_documentfile_version"

    // glide
    implementation "com.github.bumptech.glide:glide:$glide_version"
    kapt "com.github.bumptech.glide:compiler:$glide_version"

    // dagger
    implementation "com.google.dagger:dagger:$dagger_version"
    implementation "com.google.dagger:dagger-android-support:$dagger_version"
    kapt "com.google.dagger:dagger-android-processor:$dagger_version"
    kapt "com.google.dagger:dagger-compiler:$dagger_version"
    //Resolve jdk8+ Generation Annotations - javax annotation does not exist
    implementation 'com.github.pengrad:jdk9-deps:1ffe84c468'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // rxjava
    implementation "io.reactivex.rxjava2:rxandroid:$rxandroid_version"
    implementation "io.reactivex.rxjava2:rxjava:$rxjava_version"
    implementation "io.reactivex.rxjava2:rxkotlin:$rxkotlin_version"

    // testing
    // On-device tests (src/androidTest); the plain unit tests use JUnit only.
    androidTestImplementation "androidx.test:runner:$androidx_testrunner_version"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "org.mockito:mockito-android:$mockito_version"
    testImplementation "junit:junit:$junit_version"

    // coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-rx2:$coroutines_version"

    implementation "com.f2prateek.rx.preferences2:rx-preferences:$rx_preferences_version"
    implementation "com.jakewharton.timber:timber:$timber_version"
    implementation "com.squareup.moshi:moshi:$moshi_version"
    // Adapters for the backup and changelog types are generated at build time: no reflection, so
    // R8 can't break them (it did, silently, in 2.3.1, and again under Kotlin 2 + Moshi 1.15).
    // Through KSP: Moshi's kapt path can't read Kotlin 2.2 metadata.
    ksp "com.squareup.moshi:moshi-kotlin-codegen:$moshi_version"
    implementation "com.squareup.okhttp3:okhttp:$okhttp3_version"
    implementation 'io.michaelrocks:libphonenumber-android:8.13.47'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // work manager
    implementation("androidx.work:work-runtime-ktx:$androidx_work_version")
    implementation "androidx.work:work-rxjava2:$androidx_work_version"

    implementation project(":android-smsmms")
    implementation project(':common')
    implementation project(':domain')

}

// EmojiReactionPatternsTest reads the shipped pattern files; declare them so editing one re-runs
// the tests instead of Gradle reusing an earlier pass.
tasks.withType(Test).configureEach {
    inputs.dir("src/main/assets/emojis")
    // SilentFailureGuardsTest reads these sources
    inputs.file("src/main/java/com/moez/QKSMS/manager/QkTransaction.kt")
    inputs.file("../android-smsmms/src/main/java/com/android/mms/transaction/DownloadManager.java")
    inputs.file("../android-smsmms/src/main/java/com/android/mms/transaction/PushReceiver.java")
    inputs.dir("src/main/java/com/moez/QKSMS/receiver")
    inputs.dir("src/main/java/com/moez/QKSMS/service")
}
